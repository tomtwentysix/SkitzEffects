monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_08_00.0"
      }
    ]
    actions = {
      update-props = {
        device.description = "Sound BlasterX AE-5 Plus"
        device.nick = "Sound BlasterX AE-5 Plus"
      }
    }
  },
  {
    matches = [
      {
        device.name = "alsa_card.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00"
      }
    ]
    actions = {
      update-props = {
        device.description = "Midas UMC22"
        device.nick = "Midas UMC22"
      }
    }
  },
  {
    matches = [
      {
        device.name = "alsa_card.usb-C-Media_Electronics_Inc._USB_Audio_Device-00"
      }
    ]
    actions = {
      update-props = {
        device.description = "Headphone Stand"
        device.nick = "Headphone Stand"
      }
    }
  },
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_01_00.1"
      }
    ]
    actions = {
      update-props = {
        device.description = "Built In Audio"
        device.nick = "Built In Audio"
      }
    }
  },
  {
    matches = [
      {
        device.name = "alsa_card.usb-0a12_DALI_IO_100306010587-00"
      }
    ]
    actions = {
      update-props = {
        device.description = "Dali IO6"
        device.nick = "Dali IO6"
      }
    }
  },
]

